[[repos]]
repo = "local"
hooks = [
  { id = "terraform-fmt", name = "tofu fmt", language = "system", entry = "tofu fmt -check -recursive terraform", pass_filenames = false, files = "\\.tf$" },
  { id = "tflint", name = "tflint", language = "system", entry = "bash -c 'ROOT=\"$(pwd)\"; cd terraform && tflint --recursive --config \"$ROOT/.tflint.hcl\"'", pass_filenames = false, files = "\\.tf$" },
  { id = "ryl", name = "ryl", language = "system", entry = "ryl", types = ["yaml"] },
  { id = "rumdl", name = "rumdl", language = "system", entry = "rumdl check", types = ["markdown"] },
  { id = "shellcheck", name = "shellcheck", language = "system", entry = "bash -c 'shopt -s nullglob; shellcheck scripts/*.sh terraform/modules/*/*.sh'", pass_filenames = false, types = ["shell"] },
  { id = "gitleaks", name = "gitleaks", language = "system", entry = "gitleaks protect --staged --no-banner --redact", pass_filenames = false },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.2.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"], args = ["feat", "fix", "docs", "chore", "refactor", "test", "ci"] },
]
