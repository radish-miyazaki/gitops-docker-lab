name: ci

on:
  push:
    branches: [main]
  pull_request:

# 読み取りだけで足りる。Action にトークンを渡す範囲を最小にする
permissions:
  contents: read

# 連続 push で古い run を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # ryl の cold build が長引いても 6 時間回さない
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks が履歴を走査するため全履歴を取る
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          # .mise.toml のバージョンをそのまま使う
          install: true
          cache: true
      - run: mise run lint
