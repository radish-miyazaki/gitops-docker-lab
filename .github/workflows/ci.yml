name: ci

on:
  push:
    branches: [main]
  pull_request:

# 読み取りだけで足りる。Action にトークンを渡す範囲を最小にする
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks が履歴を走査するため全履歴を取る
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          # .mise.toml のバージョンをそのまま使う
          install: true
          cache: true
      - run: mise run lint
