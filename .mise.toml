# Docker 以外のツールはすべてここで固定し、グローバル環境を汚さない
[tools]
opentofu = "1.12.6"
tflint = "0.64.0"
terraform-docs = "0.24.0"
prek = "0.5.0"
rumdl = "0.2.62"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
mkcert = "1.4.4"
"cargo:ryl" = "0.21.0"

[tasks.lint]
description = "fmt / validate / tflint / YAML / Markdown / 秘匿値チェック"
file = "scripts/lint.sh"

[tasks.docs]
description = "terraform-docs で各 README を更新する"
file = "scripts/docs.sh"

[tasks.bootstrap]
description = "platform → forgejo を apply し、sample-app を push する"
file = "scripts/bootstrap.sh"

[tasks.destroy]
description = "forgejo → platform の順に destroy する"
file = "scripts/destroy.sh"

[tasks.creds]
description = "lab-secrets の内容を表示する"
file = "scripts/creds.sh"

[tasks.demo]
description = "変更を push して反映を見る手順を表示する"
file = "scripts/demo.sh"
